<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a111f" />
  <title>Hub no celular</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icone.svg" />
  <link rel="apple-touch-icon" href="icone.svg" />
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <header id="topo">
    <button id="voltar" class="icone" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="topo-avatar"></span>
    <div id="topo-texto">
      <h1 id="titulo">Hub</h1>
      <p id="subtitulo"></p>
    </div>
    <span id="pc" class="pc" title="Situação do PC"></span>
    <button id="menu" class="icone" aria-label="Mais opções" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
    </button>
  </header>
  <main id="tela" aria-live="polite"></main>
  <nav id="abas" aria-label="Seções" hidden>
    <button data-aba="inicio"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>Projetos</span></button>
    <button data-aba="assistente"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span>Assistente</span></button>
    <button data-aba="ajustes"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>Ajustes</span></button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
